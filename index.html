<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#fbf6ee">
<title>Recipes</title>
<style>
:root{--bg:#fbf6ee;--fg:#2b2118;--mut:#7a6a5b;--card:#fff;--ln:#eadfd0;--ac:#d9672b;--ok:#3f8f5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--fg:#f3e9dc;--mut:#a39382;--card:#221b15;--ln:#352b22;--ac:#f08a4b;--ok:#6cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120e;--fg:#f3e9dc;--mut:#a39382;--card:#221b15;--ln:#352b22;--ac:#f08a4b;--ok:#6cc58a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:26px;margin:8px 0 14px}h2{font-size:22px;margin:6px 0 4px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer}
.card .e{font-size:34px}.card b{display:block;font-size:17px}.m{color:var(--mut);font-size:14px}
.back{background:none;border:none;padding:6px 0;color:var(--ac);font-weight:600}
.note{background:var(--card);border:1px dashed var(--ln);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;color:var(--mut)}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--ln);font-size:17px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--ac)}
.bar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0;background:var(--bg)}.bar button{flex:1}
.brk{margin:26px 0 10px;border-top:3px solid var(--ln);padding-top:14px}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.t{display:flex;gap:8px;align-items:center}.t input{font:inherit;font-size:22px;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 10px}
.res{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:14px 0;text-align:center}
.res b{display:block;font-size:30px;color:var(--ac)}
.st{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.st .tm{min-width:74px;font-weight:700;font-variant-numeric:tabular-nums}
.st .tt{font-weight:600;font-size:17px}.st .x{color:var(--mut);margin-top:3px;line-height:1.4}
.st.done{opacity:.4}.st.done .tt{text-decoration:line-through}.st.nx{background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:12px;padding-left:8px;padding-right:8px}
.chip{display:inline-block;font-size:13px;border:1px solid var(--ln);border-radius:99px;padding:2px 9px;margin:6px 6px 0 0;background:var(--card)}
.chip.h{border-color:var(--ac);color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<script src="recipes.js"></script>
<script>
var K="recipes-v1",P={done:{},t:{}};
try{var s=localStorage.getItem(K);if(s)P=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(P));}catch(e){}}
var S={v:"home",r:null,sel:[],msg:""};
var $=function(q){return document.querySelector(q)};
function pad(n){return String(n).padStart(2,"0")}
function fmt(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?"pm":"am";h=h%12||12;return h+":"+pad(mm)+" "+ap}
function dur(d){return d>=60?Math.floor(d/60)+"h"+(d%60?" "+d%60+"m":""):d+" min"}
function nowT(){var d=new Date(),m=Math.ceil((d.getHours()*60+d.getMinutes())/5)*5;m%=1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function tp(){var r=S.r;P.t[r.id]=P.t[r.id]||{time:nowT(),mode:"start"};return P.t[r.id]}
function render(){
 var h="",r=S.r,A=$("#app");
 if(S.v==="home"){
  h="<h1>🍽️ Recipes</h1>"+R.map(function(x,i){return '<div class="card" data-a="open" data-i="'+i+'"><span class="e">'+x.e+'</span><div><b>'+x.n+'</b><span class="m">'+x.ing.length+" ingredients · about "+dur(x.total)+"</span></div></div>"}).join("")+'<p class="m">More recipes get added here whenever we work one out together.</p>';
 }else if(S.v==="ing"){
  h='<button class="back" data-a="home">‹ Recipes</button><h2>'+r.e+" "+r.n+'</h2><div class="note">'+r.note+'</div><div class="m" style="margin:10px 0">Tick what you need to buy</div>'
  +r.ing.map(function(x,i){return '<label class="row"><input type="checkbox" data-a="sel" data-i="'+i+'"'+(S.sel[i]?" checked":"")+"><span>"+x+"</span></label>"}).join("")
  +'<div class="m" id="msg" style="margin-top:10px">'+S.msg+'</div><div class="bar"><button data-a="send">Send to Reminders ('+S.sel.filter(Boolean).length+')</button><button class="p" data-a="cook">Start cooking ›</button></div>';
 }else{
  var q=tp(),b=0,t=q.time.split(":"),tm=+t[0]*60+ +t[1];b=q.mode==="start"?tm:tm-r.total;
    h='<button class="back" data-a="ing">‹ Ingredients</button><h2>'+r.e+" "+r.n+'</h2><div class="seg"><button class="'+(q.mode==="start"?"on":"")+'" data-a="mode" data-m="start">I start at</button><button class="'+(q.mode==="fin"?"on":"")+'" data-a="mode" data-m="fin">I want it ready at</button></div>'
  +'<div class="t"><input type="time" id="tin" value="'+q.time+'"><button data-a="now">Now</button></div>'
  +'<div class="res">'+(q.mode==="start"?'Estimated finish<b>'+fmt(b+r.total)+"</b>":'Start cooking at<b>'+fmt(b)+"</b>")+'<span class="m">Total about '+dur(r.total)+"</span></div>"
  +'<div class="brk"></div>'
  +r.st.map(function(s,i){return '<div class="st"><div class="tm">'+fmt(b+s.a)+'</div><div><div class="tt">'+s.t+'</div><div class="x">'+s.x+"</div>"+(s.g?'<span class="chip h">'+s.g+"</span>":"")+'<span class="chip">'+dur(s.d)+"</span></div></div>"}).join("");
 }
 A.innerHTML=h;
 var ti=$("#tin");if(ti)ti.onchange=function(){tp().time=ti.value||tp().time;save();render()};
}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,i=+el.dataset.i;
 if(el.tagName==="INPUT"&&a==="sel"){S.sel[i]=el.checked;S.msg="";render();return}
 if(a==="open"){S.r=R[i];S.sel=[];S.msg="";S.v="ing"}
 else if(a==="home")S.v="home";
 else if(a==="ing")S.v="ing";
 else if(a==="cook")S.v="cook";
 else if(a==="mode"){tp().mode=el.dataset.m;save()}
 else if(a==="now"){tp().time=nowT();save()}
 else if(a==="send"){send();return}
 else return;
 render();window.scrollTo(0,0);
});
function send(){
 var L=S.r.ing.filter(function(x,i){return S.sel[i]});
 if(!L.length){S.msg="Tick at least one ingredient first.";render();return}
 var txt=L.join("\n");
 function copy(){var ok=false;try{var t=document.createElement("textarea");t.value=txt;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();t.setSelectionRange(0,9999);ok=document.execCommand("copy");document.body.removeChild(t)}catch(e){}
  if(!ok&&navigator.clipboard){try{navigator.clipboard.writeText(txt);ok=true}catch(e){}}
  S.msg=ok?"Copied. Open Reminders and paste.":"Couldn’t copy. Your list: "+L.join(", ");render()}
 if(navigator.share){navigator.share({title:"Shopping",text:txt}).catch(function(e){if(!e||e.name!=="AbortError")copy()})}else copy();
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
